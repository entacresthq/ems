# /etc/nginx/sites-available/ems  (symlinked into sites-enabled)
#
# Every business on the multi-business EMS server, through one nginx site:
# <id>.ems.example.ng and any business's own domain all go to the same EMS
# process, which picks the business from the address. Replace ems.example.ng
# with your EMS_BASE_DOMAIN.
#
# HTTPS for the wildcard needs a DNS challenge (see deploy/hosted/README.md):
#   sudo certbot certonly --manual --preferred-challenges dns \
#     -d 'ems.example.ng' -d '*.ems.example.ng'
# A business's own domain gets its own certificate:
#   sudo certbot --nginx -d ems.ayothrift.ng

upstream ems {
    server 127.0.0.1:8080;
    keepalive 16;
}

# Plain HTTP: only certificate checks and the redirect to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name ems.example.ng *.ems.example.ng;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ems.example.ng *.ems.example.ng;

    ssl_certificate     /etc/letsencrypt/live/ems.example.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ems.example.ng/privkey.pem;

    # Customer photos, signatures and guarantor images are uploaded through the API.
    client_max_body_size 20m;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    location / {
        proxy_pass http://ems;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # EMS picks the business from the Host header.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # nginx is the only proxy, so overwrite rather than append.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
