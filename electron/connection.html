<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>EMS connection settings</title>
    <style>
      :root {
        --ink: #15201b;
        --ink-2: #4a5550;
        --paper: #f6f4ee;
        --surface: #ffffff;
        --rule: #dcd8cc;
        --ledger: #0b6b47;
        --brick: #b3261e;
        --ochre-tint: #fbefd9;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          14px/1.5 'IBM Plex Sans',
          'Segoe UI',
          system-ui,
          sans-serif;
      }
      main {
        padding: 24px;
        max-width: 620px;
      }
      h1 {
        margin: 0;
        font-size: 18px;
      }
      p.lead {
        margin: 4px 0 20px;
        color: var(--ink-2);
      }
      .option {
        display: block;
        background: var(--surface);
        border: 1px solid var(--rule);
        border-radius: 6px;
        padding: 14px 16px;
        margin-bottom: 10px;
        cursor: pointer;
      }
      .option:has(input:checked) {
        border-color: var(--ink);
      }
      .option > span {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      .option input[type='radio'] {
        margin-top: 3px;
        accent-color: var(--ledger);
      }
      .title {
        font-weight: 600;
        display: block;
      }
      .hint {
        color: var(--ink-2);
        display: block;
      }
      .fields {
        margin: 12px 0 0 26px;
        display: none;
        gap: 10px;
      }
      .option:has(input:checked) .fields {
        display: grid;
      }
      label.field {
        display: grid;
        gap: 4px;
        font-weight: 500;
      }
      input[type='text'],
      input[type='url'],
      input[type='password'] {
        font: inherit;
        padding: 8px 10px;
        border: 1px solid #8a918d;
        border-radius: 4px;
        width: 100%;
      }
      .check {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        font-weight: 400;
      }
      .warning {
        background: var(--ochre-tint);
        border-radius: 4px;
        padding: 8px 10px;
        color: var(--ink);
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }
      button {
        font: inherit;
        font-weight: 600;
        padding: 9px 16px;
        border-radius: 4px;
        border: 1px solid #8a918d;
        background: var(--surface);
        cursor: pointer;
      }
      button.primary {
        background: var(--ledger);
        border-color: var(--ledger);
        color: #fff;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      #message {
        margin-top: 14px;
        min-height: 1.5em;
      }
      #message.ok {
        color: var(--ledger);
      }
      #message.error {
        color: var(--brick);
        font-weight: 500;
      }
      code {
        font-family: 'IBM Plex Mono', Consolas, monospace;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Where does EMS keep its data?</h1>
      <p class="lead" id="current">Loading…</p>

      <form id="form">
        <label class="option">
          <span>
            <input type="radio" name="kind" value="sqlite" />
            <span>
              <span class="title">On this computer</span>
              <span class="hint"
                >For one office using this computer. Back it up from the File menu.</span
              >
            </span>
          </span>
        </label>

        <label class="option">
          <span>
            <input type="radio" name="kind" value="postgres" />
            <span>
              <span class="title">In a Supabase (PostgreSQL) database</span>
              <span class="hint">
                The data lives in the cloud and is backed up by Supabase. This computer runs the EMS
                server; only one EMS server may use a database at a time.
              </span>
            </span>
          </span>
          <span class="fields">
            <label class="field">
              Connection string
              <input
                type="password"
                id="pgUrl"
                autocomplete="off"
                spellcheck="false"
                placeholder="postgresql://postgres.xxxx:password@aws-0-eu-west-2.pooler.supabase.com:5432/postgres"
              />
              <span class="hint">
                In Supabase: Connect → Session pooler. Use the port 5432 address, with your database
                password in it.
              </span>
            </label>
            <label class="field">
              Schema
              <input type="text" id="pgSchema" value="ems" spellcheck="false" />
              <span class="hint"
                >EMS creates its tables here. Leave as <code>ems</code> unless told otherwise.</span
              >
            </label>
            <label class="check" id="copyRow">
              <input type="checkbox" id="copy" checked />
              <span>Copy this computer’s EMS data into the new database. It must be empty.</span>
            </label>
          </span>
        </label>

        <label class="option">
          <span>
            <input type="radio" name="kind" value="remote" />
            <span>
              <span class="title">On my organisation’s EMS server</span>
              <span class="hint">
                For offices that share data. This computer opens EMS from the server; nothing is
                kept here.
              </span>
            </span>
          </span>
          <span class="fields">
            <label class="field">
              Server address
              <input
                type="url"
                id="remoteUrl"
                placeholder="https://ems.yourcompany.ng"
                spellcheck="false"
              />
            </label>
          </span>
        </label>

        <p class="warning" id="switchBack" hidden>
          Going back to this computer uses the data kept here from before. Changes made in the
          database since then aren’t copied back.
        </p>

        <div class="actions">
          <button type="button" id="test">Test connection</button>
          <button type="submit" class="primary" id="save">Save and restart EMS</button>
        </div>
        <p id="message" role="status" aria-live="polite"></p>
      </form>
    </main>

    <script>
      const $ = (id) => document.getElementById(id)
      let current = null

      const chosen = () => {
        const kind = document.querySelector('input[name=kind]:checked')?.value
        if (kind === 'postgres')
          return {
            kind,
            url: $('pgUrl').value.trim(),
            // Schema names are lowercase in PostgreSQL.
            schema: $('pgSchema').value.trim().toLowerCase() || 'ems',
          }
        if (kind === 'remote') return { kind, url: $('remoteUrl').value.trim() }
        return { kind: 'sqlite' }
      }

      function say(text, tone) {
        $('message').textContent = text
        $('message').className = tone || ''
      }

      function busy(on) {
        $('test').disabled = on
        $('save').disabled = on
      }

      function refresh() {
        const kind = chosen().kind
        $('switchBack').hidden = !(kind === 'sqlite' && current && current.live.kind === 'postgres')
      }

      async function load() {
        current = await window.emsDesktop.getConnection()
        const live = current.live
        document.querySelector(`input[name=kind][value=${live.kind}]`).checked = true
        if (live.kind === 'remote') $('remoteUrl').value = live.url
        if (live.kind === 'postgres') $('pgSchema').value = live.schema
        $('copyRow').hidden = live.kind !== 'sqlite' || !current.hasLocalData
        $('current').textContent =
          live.kind === 'sqlite'
            ? 'Now: on this computer.'
            : live.kind === 'postgres'
              ? `Now: Supabase / PostgreSQL at ${live.host}, schema ${live.schema}. Enter the connection string again to change it.`
              : `Now: connected to ${live.url}.`
        refresh()
      }

      function problem(next) {
        if (next.kind === 'postgres' && !/^postgres(ql)?:\/\//.test(next.url))
          return 'Paste the connection string. It starts with postgresql://'
        if (next.kind === 'remote' && !/^https?:\/\//.test(next.url))
          return 'Enter the full address, starting with https://'
        return null
      }

      document
        .querySelectorAll('input[name=kind]')
        .forEach((r) => r.addEventListener('change', refresh))

      $('test').addEventListener('click', async () => {
        const next = chosen()
        const issue = problem(next)
        if (issue) return say(issue, 'error')
        busy(true)
        say('Testing…')
        try {
          const result = await window.emsDesktop.testConnection(next)
          say(result.message, result.ok ? 'ok' : 'error')
        } catch (error) {
          say(String(error.message || error), 'error')
        } finally {
          busy(false)
        }
      })

      $('form').addEventListener('submit', async (event) => {
        event.preventDefault()
        const next = chosen()
        const issue = problem(next)
        if (issue) return say(issue, 'error')
        busy(true)
        say('Checking the connection…')
        try {
          const test = await window.emsDesktop.testConnection(next)
          if (!test.ok) return say(test.message, 'error')
          say('Saving. EMS restarts its live workspace…')
          const result = await window.emsDesktop.saveConnection(next, {
            copy: next.kind === 'postgres' && !$('copyRow').hidden && $('copy').checked,
          })
          if (result.ok) {
            say('Saved.', 'ok')
            setTimeout(() => window.close(), 800)
          } else say(result.message, 'error')
        } catch (error) {
          say(String(error.message || error), 'error')
        } finally {
          busy(false)
        }
      })

      load()
    </script>
  </body>
</html>
